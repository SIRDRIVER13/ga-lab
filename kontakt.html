<main><div class="wrap">

<h1>Kontakt i wycena</h1>
<form id="lead-form" class="card" style="max-width:520px">
  <label for="imie">Imię</label><input id="imie" name="imie" required>
  <label for="email">E-mail</label><input id="email" name="email" type="email" required>
  <label for="telefon">Telefon</label><input id="telefon" name="telefon" type="tel" required placeholder="np. 600 100 200">
  <label for="auto">Marka, model i rocznik samochodu</label><input id="auto" name="auto" required placeholder="np. BMW X5 E53 2004">
  <label for="usluga">Usługa</label>
  <select id="usluga" name="usluga"><option>Radio Android</option><option>Pakiet audio</option><option>Diagnostyka</option></select>
  <label for="wiad">Wiadomość</label><textarea id="wiad" name="wiad" rows="4"></textarea>
  <p><button class="btn" type="submit">Wyślij zapytanie</button></p>
  <p style="color:var(--muted);font-size:.9rem">Formularz testowy – dane nigdzie nie są wysyłane. Prosimy nie wpisywać prawdziwych danych.</p>
</form>
